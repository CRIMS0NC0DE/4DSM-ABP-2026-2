# CI (RNF08, RNF10, RP09, RP10): a cada push e pull request roda lint, build e testes.
# CD (RNF09, RP11): na main, só depois de todo o CI passar, publica a imagem e faz o deploy.
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários e de API
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Resumo
        if: always()
        run: |
          echo "### Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "Lint, tipos, testes e build: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"

  backend-integracao:
    name: Backend · integração com Postgres
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      JWT_SECRET: segredo-jwt-apenas-para-o-ci
      QR_SECRET: segredo-qr-apenas-para-o-ci
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Migrations
        run: npx prisma migrate deploy
      - name: Dados de demonstração
        run: npm run db:seed
      - name: Sobe a API
        run: node dist/server.js > api.log 2>&1 &
      - name: Teste de fumaça
        run: node scripts/smoke.mjs
      - name: Log da API
        if: failure()
        run: cat api.log

  mqtt:
    name: Broker MQTT · login, ACL e TLS
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Certificados de teste
        run: sh docker/mosquitto/gerar-certificados.sh
      - name: Sobe o Mosquitto com a configuração do projeto
        run: |
          docker run -d --name mqtt -p 1883:1883 -p 8883:8883             -v "$PWD/docker/mosquitto:/mosquitto/origem:ro"             --entrypoint sh eclipse-mosquitto:2 /mosquitto/origem/iniciar.sh
          sleep 3
      - name: Sem TLS (1883)
        working-directory: backend
        run: node scripts/mqtt-acl.mjs
      - name: Com TLS (8883)
        working-directory: backend
        env:
          MQTT_URL: mqtts://localhost:8883
          MQTT_CA_FILE: ../docker/mosquitto/certs/ca.crt
        run: node scripts/mqtt-acl.mjs
      - name: Log do broker
        if: failure()
        run: docker logs mqtt

  firmware:
    name: Firmware ESP32 · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Credenciais de exemplo
        run: cp include/credenciais.exemplo.h include/credenciais.h
      - name: Build (ST7789, ILI9341 e OLED)
        run: pio run -e tft -e ili9341 -e oled
      - name: Build com TLS no MQTT (configuração da nuvem)
        run: |
          { echo '#include "ca_digicert_g2.h"'; sed 's/#define MQTT_PORT 1883/#define MQTT_PORT 8883\n#define MQTT_CA_CERT CA_DIGICERT_GLOBAL_ROOT_G2/' include/credenciais.exemplo.h; } > include/credenciais.h
          grep -q 'MQTT_CA_CERT CA_DIGICERT' include/credenciais.h
          pio run -e tft

  frontend:
    name: Frontend · análise e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análise estática
        run: flutter analyze
      - name: Testes
        run: flutter test

  docker:
    name: Imagem Docker do backend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: passe-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (main)
    runs-on: ubuntu-latest
    needs: [backend, backend-integracao, mqtt, firmware, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      - name: Publica a imagem no GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.imagem.outputs.nome }}:latest
            ${{ steps.imagem.outputs.nome }}:${{ github.sha }}
          cache-from: type=gha
      - name: Dispara o deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL não configurado; imagem publicada, deploy não disparado."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy disparado para ${{ steps.imagem.outputs.nome }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
