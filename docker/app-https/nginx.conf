# App web (Flutter) em HTTPS, para abrir no celular. A câmera (leitor de QR) e o GPS
# do navegador só funcionam em HTTPS. A API vem pelo mesmo endereço em /api, então o
# app não precisa saber o IP do computador e não há bloqueio de conteúdo misto.
# Sobe com scripts/app-no-celular.sh (perfil "celular" do docker-compose.dev.yml).

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/app.crt;
    ssl_certificate_key /etc/nginx/certs/app.key;

    root  /usr/share/nginx/html;
    index index.html;

    # API (mesmo backend do compose). A barra final tira o /api do caminho.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Simulador e console de testes também pelo celular.
    location /simulador/ { proxy_pass http://backend:3000/simulador/; }
    location /console/   { proxy_pass http://backend:3000/console/; }

    # O index.html e o service worker nunca ficam em cache: um build novo aparece na hora.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }

    # Rotas do app caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# http://IP:8080 manda para o HTTPS.
server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
}
