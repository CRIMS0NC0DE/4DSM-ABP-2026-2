# Broker do Passe. Ninguém entra sem usuário e senha, e a ACL limita o que
# cada um lê e publica (issue #10):
#   - a API (usuário passe-api) publica as decisões de qualquer terminal;
#   - cada terminal entra com usuário = seu Id e senha = sua chave, e só lê o
#     tópico do próprio Id. Ninguém além da API publica ABRIR.
persistence false
log_dest stdout

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# 1883 = MQTT sem TLS (rede local / desenvolvimento)
listener 1883
protocol mqtt

# 9001 = MQTT sobre WebSocket, usado pelo simulador no navegador
listener 9001
protocol websockets

# O TLS (porta 8883) é ligado pelo script gerar-certificados.sh, que cria os
# certificados e o arquivo conf.d/tls.conf. Em produção, deixe só o 8883.
include_dir /mosquitto/config/conf.d
