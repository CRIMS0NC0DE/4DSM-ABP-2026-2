name: 4dsm-abp

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?schema=public
    command: npm start
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./server:/usr/src/app
      - server_node_modules:/usr/src/app/node_modules
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./public
    command: flutter run -d web-server --web-hostname 0.0.0.0 --web-port 8080
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./public:/app
      - flutter_pub_cache:/root/.pub-cache

volumes:
  postgres_data:
  server_node_modules:
  flutter_pub_cache:
