name: 4dsm-abp

# Ambiente de desenvolvimento: docker compose -f docker-compose.dev.yml up
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?schema=public
      JWT_SECRET: ${JWT_SECRET:-segredo-jwt-so-para-desenvolvimento}
      QR_SECRET: ${QR_SECRET:-segredo-qr-so-para-desenvolvimento}
    # Aplica as migrations, carrega os dados de demonstração e sobe com recarga automática.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run db:seed && npm run dev"
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: flutter run -d web-server --web-hostname 0.0.0.0 --web-port 8080 --dart-define=API_URL=http://localhost:${SERVER_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./frontend:/app
      - flutter_pub_cache:/root/.pub-cache

volumes:
  postgres_data:
  backend_node_modules:
  flutter_pub_cache:
