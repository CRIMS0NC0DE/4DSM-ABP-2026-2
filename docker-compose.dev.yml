name: 4dsm-abp

# Ambiente de desenvolvimento: docker compose -f docker-compose.dev.yml up
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Broker MQTT: o backend publica ABRIR/NEGAR e o terminal (ESP32 ou simulador) escuta.
  # 1883 = MQTT para o ESP32; 9001 = MQTT sobre WebSocket para o simulador no navegador;
  # 8883 = MQTT com TLS (depois de rodar docker/mosquitto/gerar-certificados.sh).
  # Exige usuário e senha (docker/mosquitto/passwd) e aplica a ACL (docker/mosquitto/acl).
  mqtt:
    image: eclipse-mosquitto:2
    entrypoint: ["sh", "/mosquitto/origem/iniciar.sh"]
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./docker/mosquitto:/mosquitto/origem:ro

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?schema=public
      JWT_SECRET: ${JWT_SECRET:-segredo-jwt-so-para-desenvolvimento}
      QR_SECRET: ${QR_SECRET:-segredo-qr-so-para-desenvolvimento}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: passe-api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:-passe-api-dev}
      MQTT_WS_URL: ws://localhost:${MQTT_WS_PORT:-9001}
      # Chave do terminal de demonstração. O seed grava essa chave a cada subida; depois de
      # trocar a chave (provisionar-terminal.mjs --trocar-chave), o script a guarda no .env da
      # raiz, e o backend, o broker e o credenciais.h continuam com a mesma chave.
      TERMINAL_DEMO_KEY: ${TERMINAL_DEMO_KEY:-chave-demo-terminal-catraca-1}
    # Aplica as migrations, carrega os dados de demonstração e sobe com recarga automática.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run db:seed && npm run dev"
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    depends_on:
      database:
        condition: service_healthy
      mqtt:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    command: flutter run -d web-server --web-hostname 0.0.0.0 --web-port 8080 --dart-define=API_URL=http://localhost:${SERVER_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./frontend:/app
      - flutter_pub_cache:/root/.pub-cache

  # App web em HTTPS para o celular (câmera e GPS só funcionam em HTTPS). Não sobe com o
  # resto: use scripts/app-no-celular.sh, que gera o certificado e o build do app antes.
  app-https:
    image: nginx:1.27-alpine
    profiles: ["celular"]
    ports:
      - "${APP_HTTPS_PORT:-8443}:8443"
      - "${APP_HTTP_PORT:-8080}:8080"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./docker/app-https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/app-https/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  flutter_pub_cache:
